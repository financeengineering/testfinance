<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>ESTA · 110 SPPC Finans ve Saha Raporu</title>
<meta name="theme-color" content="#0B0B0C" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap');

  * , *::before, *::after { box-sizing: border-box; }

  :root {
    --bg1: #1a1a1d; --bg2: #0a0a0b;
    --ink: #0B0B0C;
    --surface: #17171A; --surface2: #0E0E10;
    --surface-dark1: #141416; --surface-dark2: #0D0D0F;
    --border: #26262A; --border-strong: #2A2A2E; --border-warm: #2E2A20;
    --track: #232326; --track-alt: #1D1D20; --track-alt2: #1B1B1E;
    --divider: rgba(35,35,38,0.44);
    --pill-bg: #232120;
    --text-primary: #F2EFE6;
    --text-label: #B8B5AC;
    --text-secondary: #C7C4BB;
    --text-muted: #ABA79D;
    --text-dim: #8C8A83;
    --text-strongalt: #DCD9CE;
    --gold: #C4A876; --gold-dark: #856E4B; --gold-oncard: #14140F;
    --red-l: #E39494; --red-d: #C15A5A;
    --green-l: #9FDDB6; --green-d: #4E9F6C;
    --orange-l: #F0B87E; --orange-d: #C77D3E;
    --tahsilat-green: #5FBF7A;
    --warn-border: #4A2E2E; --warn-bg1: #1D1414; --warn-bg2: #150F0F;
    --nav-bg: #101012;
    --rivet: #3A3A3E; --rivet-shadow: #050505;
    --shadow-ambient: rgba(0,0,0,0.6);
    --shadow-lock: rgba(0,0,0,0.5);
  }

  [data-theme="light"] {
    --bg1: #F7F3E9; --bg2: #EFE9DA;
    --ink: #FBF8F1;
    --surface: #FFFFFF; --surface2: #F3EEE1;
    --surface-dark1: #FBF3E4; --surface-dark2: #F3E9D3;
    --border: #E4DFD2; --border-strong: #D8D2C2; --border-warm: #D9CBAE;
    --track: #ECE6D8; --track-alt: #F1EBDC; --track-alt2: #F1EBDC;
    --divider: rgba(200,190,165,0.5);
    --pill-bg: #EDE7D8;
    --text-primary: #2A2620;
    --text-label: #5B5346;
    --text-secondary: #4E483C;
    --text-muted: #736A59;
    --text-dim: #8A8272;
    --text-strongalt: #3A342A;
    --gold: #8A6F3F; --gold-dark: #6B5636; --gold-oncard: #FFFFFF;
    --red-l: #C15A5A; --red-d: #8F3B3B;
    --green-l: #3F8F5F; --green-d: #2E6E48;
    --orange-l: #C77D3E; --orange-d: #9B5F2C;
    --tahsilat-green: #2E8F52;
    --warn-border: #E3C4C4; --warn-bg1: #FBEDED; --warn-bg2: #F7E3E3;
    --nav-bg: #FFFFFF;
    --rivet: #D8D2C2; --rivet-shadow: #FFFFFF;
    --shadow-ambient: rgba(120,110,90,0.2);
    --shadow-lock: rgba(120,110,90,0.18);
  }

  html, body {
    margin: 0; padding: 0;
    background-color: var(--ink);
    background: radial-gradient(circle at 50% 0%, var(--bg1) 0%, var(--bg2) 60%);
    font-family: 'Inter', sans-serif;
    -webkit-tap-highlight-color: transparent;
    height: 100%;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 20px 10px 34px;
  }

  @keyframes esta-sweep {
    0% { left: -60%; }
    55% { left: 130%; }
    100% { left: 130%; }
  }
  .esta-shine { position: relative; overflow: hidden; display: inline-block; }
  .esta-shine::after {
    content: '';
    position: absolute; top: 0; left: -60%;
    width: 40%; height: 100%;
    background: linear-gradient(115deg, transparent 0%, rgba(255,255,255,0.55) 50%, transparent 100%);
    animation: esta-sweep 3.2s ease-in-out infinite;
  }
  .esta-shine img { width: 100%; height: 100%; object-fit: contain; display: block; }

  /* ---------------- TELEFON ÇERÇEVESİ ---------------- */
  .esta-phoneframe {
    width: 100%;
    max-width: 430px;
    background: var(--ink);
    border-radius: 30px;
    border: 1px solid var(--border-strong);
    box-shadow: 0 30px 80px var(--shadow-ambient), inset 0 0 0 1px rgba(255,255,255,0.02);
    overflow: hidden;
    display: none;
    flex-direction: column;
    min-height: calc(100vh - 54px);
    position: relative;
  }
  .esta-phoneframe.is-visible { display: flex; }

  .esta-header {
    padding: 4px 18px 14px;
    background:
      repeating-linear-gradient(115deg, rgba(196,168,118,0.05) 0px, rgba(196,168,118,0.05) 1px, transparent 1px, transparent 14px),
      linear-gradient(180deg, var(--surface) 0%, var(--surface2) 100%);
    border-bottom: 1px solid var(--border-strong);
    flex-shrink: 0;
    position: relative;
  }
  .esta-header::before, .esta-header::after {
    content: '';
    position: absolute;
    top: 10px;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--rivet);
    box-shadow: inset 0 0 0 1px var(--rivet-shadow);
  }
  .esta-header::before { left: 10px; }
  .esta-header::after { right: 10px; }

  .esta-header-row { display: flex; align-items: center; gap: 10px; }
  .esta-logo-badge-wrap { width: 34px; height: 40px; flex-shrink: 0; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4)); }
  .esta-wordmark { font-family: 'Oswald', sans-serif; font-size: 10px; letter-spacing: 1.5px; color: var(--text-dim); font-weight: 500; }
  .esta-project { font-family: 'Oswald', sans-serif; font-size: 19px; letter-spacing: 1px; color: var(--text-primary); font-weight: 600; line-height: 1.15; }
  .esta-header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .esta-theme-toggle {
    width: 30px; height: 30px; border-radius: 8px;
    background: var(--surface2); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex-shrink: 0;
  }
  .esta-theme-toggle svg { stroke: var(--gold); }
  .esta-header-date { font-size: 11px; color: var(--gold); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .esta-header-date-block { text-align: right; }
  .esta-header-date-label { font-size: 8px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 1px; white-space: nowrap; }

  .esta-search-wrap { position: relative; margin-top: 12px; }
  .esta-search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); pointer-events: none; }
  .esta-search-input {
    width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 12px 9px 34px; font-size: 12.5px; color: var(--text-primary); outline: none;
    font-family: 'Inter', sans-serif;
  }
  .esta-search-input:focus { border-color: var(--gold-dark); }

  .esta-select {
    flex: 1; min-width: 0; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 10px; font-size: 12.5px; color: var(--text-primary); outline: none;
    font-family: 'Inter', sans-serif;
  }
  .esta-select:focus { border-color: var(--gold-dark); }

  .esta-preset-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .esta-preset-btn {
    background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
    padding: 7px 14px; font-family: 'Oswald', sans-serif; font-size: 11.5px; letter-spacing: 0.4px;
    color: var(--text-muted); cursor: pointer; font-weight: 600;
  }
  .esta-preset-btn.active { background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: var(--gold-oncard); border-color: var(--gold-dark); }
  .esta-search-results {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    max-height: 280px; overflow-y: auto; z-index: 50; display: none;
    box-shadow: 0 16px 34px var(--shadow-ambient);
  }
  .esta-search-results.open { display: block; }
  .esta-search-result-item {
    padding: 10px 12px; font-size: 12.5px; color: var(--text-primary); cursor: pointer;
    border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .esta-search-result-item:last-child { border-bottom: none; }
  .esta-search-result-item:hover, .esta-search-result-item:active { background: var(--track-alt); }
  .esta-search-result-tag { font-size: 9.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap; }
  .esta-search-highlight { animation: esta-search-flash 1.5s ease; border-radius: 14px; }
  @keyframes esta-search-flash {
    0% { box-shadow: 0 0 0 3px var(--gold); }
    100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); }
  }

  .esta-content { flex: 1; overflow-y: auto; padding: 16px 14px 30px; -webkit-overflow-scrolling: touch; }
  .esta-tab-body { display: none; flex-direction: column; gap: 14px; }
  .esta-tab-body.active { display: flex; }

  .esta-pdf-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; background: var(--surface); border: 1px solid var(--gold-dark); border-radius: 12px;
    padding: 12px 0; cursor: pointer;
    font-family: 'Oswald', sans-serif; font-size: 12.5px; letter-spacing: 0.8px;
    color: var(--gold); font-weight: 600;
  }
  .esta-pdf-btn svg { stroke: var(--gold); }
  .esta-pdf-btn:active { background: var(--track-alt); }

  .esta-section-title {
    display: flex; align-items: center; gap: 8px;
    font-family: 'Oswald', sans-serif; font-size: 12px; letter-spacing: 1.6px;
    color: var(--gold); font-weight: 600; text-transform: uppercase; margin: 6px 0 2px;
  }
  .esta-section-tick { width: 12px; height: 2px; background: var(--gold); display: inline-block; }

  .esta-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
  .esta-card-dark { background: linear-gradient(160deg, var(--surface-dark1) 0%, var(--surface-dark2) 100%); border: 1px solid var(--border-warm); }
  .esta-divider { height: 1px; background: var(--border); margin: 10px 0; }

  .esta-contract-label { font-family: 'Oswald', sans-serif; font-size: 12px; letter-spacing: 0.5px; color: var(--text-label); margin-top: 2px; }
  .esta-contract-total { font-family: 'Oswald', sans-serif; font-size: 27px; color: var(--gold); font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }

  .esta-kv-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; font-size: 12.5px; color: var(--text-muted); border-bottom: 1px dashed var(--divider); }
  .esta-kv-row:last-child { border-bottom: none; }
  .esta-kv-val { color: var(--text-primary); font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }

  .esta-collapse-card { padding: 0; overflow: hidden; }
  .esta-collapse-head { width: 100%; background: none; border: none; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; font: inherit; text-align: left; }
  .esta-collapse-head > div:first-child { flex: 1; min-width: 0; text-align: left; }
  .esta-collapse-label { font-family: 'Oswald', sans-serif; font-size: 11.5px; letter-spacing: 0.4px; color: var(--text-label); text-align: left; }
  .esta-collapse-total { font-family: 'Oswald', sans-serif; font-size: 18px; color: var(--gold); font-weight: 600; margin-top: 3px; }
  .esta-collapse-body { padding: 0 16px 14px; display: none; }
  .esta-collapse-body.open { display: block; }
  .esta-chev { color: var(--gold); flex-shrink: 0; transition: transform .2s; }
  .esta-chev.open { transform: rotate(180deg); }

  .esta-gauge-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .esta-gauge-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 8px 12px; display: flex; flex-direction: column; align-items: center; text-align: center; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

  /* ---------------- SÜRÜKLE-BIRAK SIRALAMA ---------------- */
  @keyframes esta-jiggle {
    0%, 100% { transform: rotate(-1deg); }
    50% { transform: rotate(1deg); }
  }
  .esta-reorder-mode > * { animation: esta-jiggle 0.22s ease-in-out infinite; cursor: grab; touch-action: none; }
  .esta-reorder-mode.esta-bottomnav > * { animation-name: esta-jiggle; }
  .esta-dragging { animation: none !important; opacity: 0.55; cursor: grabbing !important; z-index: 50; box-shadow: 0 8px 24px var(--shadow-ambient); touch-action: none; }
  .esta-gauge-ringwrap { position: relative; width: 84px; height: 84px; display: flex; align-items: center; justify-content: center; }
  .esta-gauge-fill { animation: esta-gauge-fill-anim 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  @keyframes esta-gauge-fill-anim {
    from { stroke-dashoffset: var(--esta-circ); }
    to { stroke-dashoffset: var(--esta-offset); }
  }

  /* ---------------- DOKUNMA DALGA EFEKTİ (RIPPLE) ---------------- */
  .esta-ripple { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.32); transform: scale(0); animation: esta-ripple-anim 0.55s ease-out; pointer-events: none; z-index: 5; }
  @keyframes esta-ripple-anim { to { transform: scale(1); opacity: 0; } }

  /* ---------------- BAR GRAFİK ÇİZİLME ANİMASYONU ---------------- */
  .esta-bar-grow { transform-box: fill-box; transform-origin: bottom; animation: esta-bar-grow-anim 0.7s cubic-bezier(0.16, 1, 0.3, 1) backwards; }
  @keyframes esta-bar-grow-anim { from { transform: scaleY(0); } to { transform: scaleY(1); } }

  .esta-line-draw { stroke-dasharray: 4000; stroke-dashoffset: 4000; animation: esta-line-draw-anim 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  @keyframes esta-line-draw-anim { to { stroke-dashoffset: 0; } }

  /* ---------------- GRAFİK CHIP BUTONLARI ---------------- */
  .esta-chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .esta-chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 13px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); font-size: 12px; font-weight: 600; color: var(--text-secondary); cursor: pointer; touch-action: manipulation; transition: background 0.18s, border-color 0.18s, color 0.18s; font-family: inherit; }
  .esta-chip.active { background: var(--gold); color: var(--gold-oncard); border-color: var(--gold-dark); }
  .esta-chip-swatch { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .esta-line-legend-item { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-muted); }
  .esta-line-legend-item i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  /* ---------------- GRAFİK ÜZERİNDE DEĞER BALONCUĞU ---------------- */
  .esta-point-label { font-size: 8.5px; font-weight: 700; font-family: 'Inter'; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; }
  .esta-chart-wrap { position: relative; }
  .esta-gauge-pct { position: absolute; font-family: 'Oswald', sans-serif; font-size: 16px; color: var(--text-primary); font-weight: 600; font-variant-numeric: tabular-nums; }
  .esta-gauge-pct-clickable { cursor: pointer; touch-action: manipulation; }
  .esta-gauge-pct-clickable::after { content: ''; position: absolute; inset: -10px; }
  .esta-formula-toast {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%) translateY(10px);
    background: var(--surface-strong, var(--nav-bg)); border: 1px solid var(--gold-dark); border-radius: 12px;
    padding: 10px 16px; font-size: 12px; color: var(--text-primary); max-width: 88vw; text-align: center;
    box-shadow: 0 8px 24px var(--shadow-ambient); z-index: 300; opacity: 0; pointer-events: none;
    transition: opacity 0.22s ease, transform 0.22s ease;
  }
  .esta-formula-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  .esta-gauge-big { font-family: 'Oswald', sans-serif; font-size: 14px; color: var(--gold); font-weight: 600; margin-top: 8px; }
  .esta-gauge-label { font-size: 10.5px; color: var(--text-label); margin-top: 3px; font-weight: 600; }
  .esta-gauge-sub { font-size: 10.5px; color: var(--text-muted); margin-top: 3px; line-height: 1.3; }

  .esta-days-row { display: flex; align-items: center; }
  .esta-days-col { flex: 1; text-align: center; }
  .esta-days-num { font-family: 'Oswald', sans-serif; font-size: 32px; color: var(--gold); font-weight: 600; }
  .esta-days-label { font-size: 10.5px; color: var(--text-muted); margin-top: 2px; }
  .esta-days-date { font-size: 11.5px; color: var(--text-muted); margin-top: 1px; }
  .esta-days-sep { width: 1px; align-self: stretch; background: var(--border); margin: 0 10px; }
  .esta-tiny-note { text-align: center; font-size: 11.5px; color: var(--text-muted); margin-top: 10px; }

  .esta-bar1 { height: 6px; border-radius: 4px; background: var(--track); overflow: hidden; margin: 6px 0; }
  .esta-bar1-fill { height: 100%; border-radius: 4px; display: block; }
  .esta-accent-gold { background: linear-gradient(90deg, var(--gold-dark), var(--gold)); }
  .esta-accent-green { background: linear-gradient(90deg, var(--green-d), var(--green-l)); }
  .esta-accent-red { background: linear-gradient(90deg, var(--red-d), var(--red-l)); }
  .esta-accent-orange { background: linear-gradient(90deg, var(--orange-d), var(--orange-l)); }

  /* ---------------- KDV TOGGLE (Avans) ---------------- */
  .esta-vat-toggle { display: flex; gap: 8px; }
  .esta-vat-btn {
    flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 0; font-family: 'Oswald', sans-serif; font-size: 12.5px; letter-spacing: 0.5px;
    color: var(--text-muted); cursor: pointer; font-weight: 600;
  }
  .esta-vat-btn.active { background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: var(--gold-oncard); border-color: var(--gold-dark); }

  .esta-tworow { padding: 10px 0; border-bottom: 1px dashed var(--divider); }
  .esta-tworow:last-child { border-bottom: none; }
  .esta-tworow-label { font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
  .esta-tworow-vals { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .esta-tworow-val { font-size: 15px; color: var(--text-primary); font-weight: 700; font-variant-numeric: tabular-nums; }
  .esta-tworow-pct { margin-left: auto; font-family: 'Oswald', sans-serif; font-size: 13px; color: var(--gold); font-weight: 600; background: var(--pill-bg); padding: 2px 8px; border-radius: 6px; }

  .esta-warn-card { border: 1px solid var(--warn-border); background: linear-gradient(160deg, var(--warn-bg1) 0%, var(--warn-bg2) 100%); }
  .esta-warn-label { font-size: 11.5px; color: var(--red-l); font-weight: 600; margin-bottom: 8px; }
  .esta-warn-vals { display: flex; gap: 18px; }
  .esta-warn-vals div { font-size: 17px; color: var(--text-primary); font-weight: 700; font-variant-numeric: tabular-nums; }

  .esta-chart-big { font-family: 'Oswald', sans-serif; font-size: 24px; color: var(--gold); font-weight: 600; margin-bottom: 4px; }
  .esta-chart-scroll { overflow-x: auto; margin: 0 -4px; padding-bottom: 2px; }
  .esta-chart-legend { display: flex; gap: 14px; font-size: 11px; color: var(--text-muted); margin-top: 6px; }
  .esta-chart-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .esta-chart-legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

  .esta-hktipi-row { padding: 9px 0; border-bottom: 1px dashed var(--divider); }
  .esta-hktipi-row:last-child { border-bottom: none; }
  .esta-hktipi-top { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-strongalt); margin-bottom: 5px; }
  .esta-hktipi-pct { color: var(--gold); font-weight: 700; font-family: 'Oswald', sans-serif; }
  .esta-hktipi-nums { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); margin-top: 5px; font-weight: 600; }

  .esta-personel-total { font-family: 'Oswald', sans-serif; font-size: 30px; color: var(--gold); font-weight: 600; display: flex; align-items: baseline; gap: 8px; }
  .esta-personel-total span { font-family: 'Inter'; font-size: 11px; color: var(--text-muted); font-weight: 500; }
  .esta-personel-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px 6px; margin-top: 14px; }
  .esta-personel-grid > div { text-align: left; }
  .esta-personel-num { font-family: 'Oswald', sans-serif; font-size: 16px; color: var(--text-primary); font-weight: 600; }
  .esta-personel-grid div div:last-child { font-size: 10.5px; color: var(--text-muted); margin-top: 1px; }

  /* ---------------- SAHA ALT SEKME ---------------- */
  .esta-subnav { display: flex; gap: 8px; }
  .esta-subnav-btn {
    flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 0; font-family: 'Oswald', sans-serif; font-size: 12.5px; letter-spacing: 0.5px;
    color: var(--text-muted); cursor: pointer; font-weight: 600;
  }
  .esta-subnav-btn.active { background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: var(--gold-oncard); border-color: var(--gold-dark); }
  .esta-subpanel { display: none; flex-direction: column; gap: 14px; }
  .esta-subpanel.active { display: flex; }

  .esta-saha-card { padding: 14px; }
  .esta-saha-head { width: 100%; background: none; border: none; padding: 0; display: flex; justify-content: space-between; align-items: center; cursor: pointer; margin-bottom: 6px; font: inherit; }
  .esta-saha-name { font-size: 13px; color: var(--text-primary); font-weight: 600; text-align: left; }
  .esta-saha-pct { font-family: 'Oswald', sans-serif; font-size: 15px; color: var(--gold); font-weight: 600; }
  .esta-saha-sub {
    display: inline-block; margin-top: 8px; font-size: 11.5px; color: var(--text-secondary);
    background: var(--track-alt); border: 1px solid var(--border); padding: 4px 9px; border-radius: 6px; font-weight: 600;
  }
  .esta-saha-secondbar { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .esta-saha-secondbar span:first-child { font-size: 10.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; flex-shrink: 0; font-weight: 600; }
  .esta-saha-secondbar .esta-bar1 { flex: 1; margin: 0; }
  .esta-saha-pctsmall { color: var(--text-secondary); font-weight: 700; font-size: 12px; }
  .esta-saha-detail { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--divider); display: none; flex-direction: column; gap: 6px; }
  .esta-saha-detail.open { display: flex; }
  .esta-saha-detail-row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: var(--text-muted); font-weight: 600;
    background: var(--track-alt2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
  }
  .esta-saha-detail-row span:last-child { color: var(--text-primary); font-weight: 700; font-variant-numeric: tabular-nums; font-size: 12.5px; }
  .esta-saha-more { margin-top: 10px; background: none; border: none; display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-muted); cursor: pointer; padding: 0; font: inherit; font-weight: 600; }

  .esta-aylik-checkrow { display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .esta-aylik-checkrow input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--gold); flex-shrink: 0; }
  .esta-aylik-checkrow .esta-saha-name { flex: 1; }

  /* ---------------- SAHA İLERLEME — KOMPAKT IZGARA ---------------- */
  .esta-saha-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .esta-saha-compact { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 12px 13px; cursor: pointer; touch-action: manipulation; }
  .esta-saha-compact-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 4px; margin-bottom: 6px; }
  .esta-saha-compact-name { font-size: 12px; color: var(--text-primary); font-weight: 600; line-height: 1.25; }
  .esta-saha-compact-chev { flex-shrink: 0; margin-top: 1px; transition: transform 0.25s ease; }
  .esta-saha-compact-pct { font-family: 'Oswald', sans-serif; font-size: 20px; color: var(--gold); font-weight: 700; margin-bottom: 6px; }
  .esta-saha-compact-sub { font-size: 10.5px; color: var(--text-muted); margin-top: 6px; }
  .esta-saha-compact .esta-saha-detail { margin-top: 10px; }

  /* ---------------- AÇIK İŞLER — KOMPAKT IZGARA ---------------- */
  .esta-acik-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .esta-acik-compact { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 13px 12px; touch-action: manipulation; }
  .esta-acik-name { font-size: 15px; font-weight: 700; color: var(--text-primary); line-height: 1.2; margin-bottom: 6px; }
  .esta-acik-pct { font-family: 'Oswald', sans-serif; font-size: 20px; color: var(--gold); font-weight: 700; margin-bottom: 7px; }
  .esta-acik-hakedis-block { text-align: right; margin-top: 9px; }
  .esta-acik-hakedis-label { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; font-weight: 600; }
  .esta-acik-hakedis-vals { font-size: 12px; color: var(--text-primary); font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }

  .esta-cmp-row { display: grid; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px dashed var(--divider); }
  .esta-cmp-row:last-child { border-bottom: none; }
  .esta-cmp-headerrow { border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 2px; }
  .esta-cmp-label { font-size: 12px; color: var(--text-muted); }
  .esta-cmp-cell { text-align: right; font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--text-primary); font-weight: 600; }
  .esta-cmp-head { font-family: 'Oswald', sans-serif; color: var(--gold); font-weight: 700; text-transform: uppercase; font-size: 11px; }
  .esta-cmp-total { color: var(--gold); }

  .esta-bottomnav { display: flex; border-bottom: 1px solid var(--border-strong); background: var(--nav-bg); flex-shrink: 0; padding-top: 6px; position: relative; }
  .esta-navbtn { flex: 1; background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0 10px; cursor: pointer; position: relative; font: inherit; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overflow: hidden; }
  .esta-navbtn-indicator { display: none; }
  .esta-nav-slider { position: absolute; background: var(--gold); border-radius: 3px; pointer-events: none; z-index: 2; transition: transform 0.36s cubic-bezier(0.34, 1.2, 0.64, 1), width 0.36s ease, height 0.36s ease; }
  .esta-navbtn-label { font-size: 10.5px; font-family: 'Oswald', sans-serif; letter-spacing: 0.5px; font-weight: 500; color: var(--text-dim); }
  .esta-navbtn.active .esta-navbtn-label { color: var(--gold); }
  .esta-navbtn svg { stroke: var(--text-dim); }
  .esta-navbtn.active svg { stroke: var(--gold); }

  .esta-loading { color: var(--text-muted); font-size: 12px; text-align: center; padding: 40px 0; }

  /* ---------------- GERÇEK TELEFONDA TAM EKRAN (çentik/durum çubuğu payı) --- */
  /* Masaüstünde geniş ekranda "telefon çerçevesi" mockup gibi görünsün diye    */
  /* kenar boşluğu/köşe yuvarlama bırakıyoruz; ama gerçek telefon genişliğinde  */
  /* (bu genelde gerçek kullanım anıdır) kenarlıkları kaldırıp ekranı tam       */
  /* kaplıyoruz ve çentik/Dynamic Island payını env(safe-area-inset-*) ile      */
  /* veriyoruz — aksi halde başlık çentiğin altına/üstüne giriyordu.            */
  @media (max-width: 480px) {
    body { padding: 0; align-items: stretch; }
    .esta-phoneframe {
      max-width: 100%;
      border-radius: 0;
      border: none;
      box-shadow: none;
      min-height: 100vh;
      min-height: 100dvh;
    }
    .esta-header {
      padding-top: calc(4px + env(safe-area-inset-top));
    }
    .esta-bottomnav {
      padding-bottom: calc(6px + env(safe-area-inset-bottom));
    }
  }

  /* ---------------- GENİŞ EKRAN (BİLGİSAYAR/TABLET) DASHBOARD ---------------- */
  /* Dar ekranda (telefon) yukarıdaki mobil düzen aynen kalır. Geniş ekranda    */
  /* ise sol tarafta sabit bir kenar menüsü, sağda TÜM bölümlerin alt alta      */
  /* aktığı gerçek bir dashboard görünümüne geçiyoruz — sekmeye tıklamak artık  */
  /* göster/gizle değil, o bölüme kaydırma (scroll) yapıyor.                   */
  @media (min-width: 900px) {
    body { padding: 32px 24px; align-items: center; }

    .esta-phoneframe.is-visible {
      display: grid;
      grid-template-columns: 240px 1fr;
      grid-template-rows: auto 1fr;
      grid-template-areas:
        "header  content"
        "nav     content";
      max-width: 1180px;
      width: 100%;
      height: 84vh;
      min-height: 640px;
    }

    .esta-header {
      grid-area: header;
      border-bottom: 1px solid var(--border-strong);
      border-right: 1px solid var(--border-strong);
      padding: 22px 18px;
    }
    .esta-header-row { flex-wrap: wrap; }
    .esta-header-right { margin-left: 0; margin-top: 14px; width: 100%; justify-content: space-between; }

    .esta-bottomnav {
      grid-area: nav;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      width: auto;
      height: 100%;
      overflow-y: auto;
      border-right: 1px solid var(--border-strong);
      border-bottom: none;
      padding: 14px 12px;
      gap: 2px;
    }
    .esta-navbtn {
      flex-direction: row;
      justify-content: flex-start;
      gap: 12px;
      padding: 11px 12px;
      border-radius: 10px;
    }
    .esta-navbtn.active { background: var(--track-alt); }
    .esta-navbtn-indicator { display: none !important; }
    .esta-navbtn-label { font-size: 13px; }

    .esta-content { grid-area: content; padding: 30px 36px 44px; }

    /* Mobilde sekmeler tek tek gösterilirken, burada hepsi alt alta akar */
    .esta-tab-body { display: flex !important; }
    .esta-tab-body:not(:last-child) {
      padding-bottom: 32px;
      margin-bottom: 32px;
      border-bottom: 1px solid var(--border);
    }
    #tab-ozet::before, #tab-avans::before, #tab-hakedis::before, #tab-acikisler::before, #tab-saha::before, #tab-harcamalar::before, #tab-grafikler::before {
      display: block;
      font-family: 'Oswald', sans-serif;
      font-size: 21px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    #tab-ozet::before { content: "Finansal Özet"; }
    #tab-avans::before { content: "Avans"; }
    #tab-hakedis::before { content: "Hakediş"; }
    #tab-acikisler::before { content: "Açık İşler"; }
    #tab-saha::before { content: "Saha İlerleme ve Personel"; }
    #tab-grafikler::before { content: "Grafikler"; }
    #tab-harcamalar::before { content: "Harcamalar"; }
    html[data-lang="ru"] #tab-ozet::before { content: "Финансовый обзор"; }
    html[data-lang="ru"] #tab-avans::before { content: "Аванс"; }
    html[data-lang="ru"] #tab-hakedis::before { content: "Акт КС"; }
    html[data-lang="ru"] #tab-acikisler::before { content: "Открытые работы"; }
    html[data-lang="ru"] #tab-saha::before { content: "Площадка и Персонал"; }
    html[data-lang="ru"] #tab-grafikler::before { content: "Графики"; }
    html[data-lang="ru"] #tab-harcamalar::before { content: "Расходы"; }

    /* Sahadaki Personel/Saha alt sekmesi de ayrı ayrı değil, birlikte aksın */
    .esta-subnav { display: none; }
    .esta-subpanel { display: flex !important; }

    /* Daha geniş alanda kart ızgaraları daha çok sütuna yayılsın */
    .esta-gauge-grid { grid-template-columns: repeat(3, 1fr); }
    .esta-saha-grid { grid-template-columns: repeat(3, 1fr); }
    .esta-personel-grid { grid-template-columns: repeat(6, 1fr); }

    /* Sol menüdeki başlıklar büyük harf ve biraz daha büyük font */
    .esta-navbtn-label { text-transform: uppercase; font-size: 14px; letter-spacing: 1px; }
  }
</style>
</head>

<script>
/* ---------------------------------------------------------------------- */
/* TEMA (KOYU / AÇIK)                                                     */
/* ---------------------------------------------------------------------- */
const THEME_KEY = 'esta_theme_pref';

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const icon = document.getElementById('themeIcon');
  if (icon) {
    icon.innerHTML = theme === 'light'
      ? '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>'
      : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  }
}

(function initTheme() {
  let saved = 'dark';
  try { saved = localStorage.getItem(THEME_KEY) || 'dark'; } catch (e) {}
  applyTheme(saved);
})();

document.getElementById('themeToggle').addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = current === 'light' ? 'dark' : 'light';
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  applyTheme(next);
});

/* ---------------------------------------------------------------------- */
/* DiL (TR / RU)                                                          */
/* ---------------------------------------------------------------------- */
const LANG_KEY = 'esta_lang_pref';

function getLang() {
  try { return localStorage.getItem(LANG_KEY) || 'tr'; } catch (e) { return 'tr'; }
}

const MONTH_MAP_RU = {
  'Oca': 'Янв', 'Şub': 'Фев', 'Mar': 'Мар', 'Nis': 'Апр', 'May': 'Май', 'Haz': 'Июн',
  'Tem': 'Июл', 'Ağu': 'Авг', 'Eyl': 'Сен', 'Eki': 'Окт', 'Kas': 'Ноя', 'Ara': 'Дек'
};

function trAy(ayStr) {
  if (getLang() !== 'ru' || typeof ayStr !== 'string') return ayStr;
  const parts = ayStr.split('.');
  if (parts.length !== 2) return ayStr;
  const ru = MONTH_MAP_RU[parts[0]];
  return ru ? `${ru}.${parts[1]}` : ayStr;
}

// TR -> RU sözlüğü. t(str) mevcut dil Rusça ise çeviriyi, yoksa orijinal
// (Türkçe) metni döndürür. Sözlükte olmayan bir metin gelirse (eksik
// çeviri), sessizce Türkçesi gösterilir — hiçbir şey kırılmaz.
const TRANSLATIONS_RU = {
  // --- Genel / navigasyon ---
  'Özet': 'Обзор', 'Avans': 'Аванс', 'Hakediş': 'Акт КС', 'İlerleme': 'Прогресс', 'Açık İşler': 'Открытые работы',
  'Saha': 'Площадка', 'Harcamalar': 'Расходы', 'Personel': 'Персонал', 'Grafikler': 'Графики',
  'Harcama Kalemleri Karşılaştırma': 'Сравнение статей расходов',
  'Toplam Harcama ve Tahsilat': 'Общий расход и поступление',
  'Genel Karşılaştırma': 'Общее сравнение',
  'Toplam Hakediş': 'Общий акт КС',
  'Karşılaştırmak için en az bir seçenek seç': 'Выберите хотя бы один вариант для сравнения',
  'Kalem Seç': 'Выбрать статьи', 'Karşılaştırmak için en az bir kalem seç': 'Выберите хотя бы одну статью для сравнения',
  'Ara: Avans, Taşeron, Banka Garantili...': 'Поиск: Аванс, Субподрядчик, Банк. гарантия...',
  'Son güncelleme:': 'Последнее обновление:',
  'Çıkış Yap': 'Выйти', 'Tema değiştir': 'Сменить тему',

let DATA = null;
let avansVatMode = 'kdvsiz';

const fmt = (n) => Number(n).toLocaleString('tr-TR');

// "6.345 M" gibi Türkçe biçimli (nokta = binlik ayraç) M değerlerini sayıya çevirir.
const parseM = (s) => {
  if (typeof s !== 'string') return Number(s) || 0;
  const cleaned = s.replace(/M/gi, '').replace(/₽/g, '').replace(/\./g, '').replace(/,/g, '.').trim();
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
};

// finansal/brüt gibi iki "M" değerinden yüzde hesaplar (brüt / finansal * 100).
const pctFromM = (finansalStr, brutStr) => {
  const f = parseM(finansalStr), b = parseM(brutStr);
  return f > 0 ? Math.round((b / f) * 100) : 0;
};

// Gerçekleşen / Proje (ya da benzeri) oran yüzdesi.
const pctFromRatio = (gerc, hedef) => (hedef > 0 ? Math.round((gerc / hedef) * 100) : 0);

// Özet göstergelerinin (gauge) yüzdesini ve alt metnini, ilgili kaynak
// rakamlardan hesaplar. Hem ekran render'ında hem PDF'te kullanılır.
function computeGaugeStats(g, d) {
  const sozGuncel = parseM(d.contractCurrent.total);
  const sozPotansiyel = parseM(d.contractPotential.total);
  const butceVal = parseM(d.butce);
  const avansTahsilatKdvsiz = parseM(d.avansSummary[0][1]);
  const sahaTahakkukGauge = d.gauges.find(x => x.label === 'Saha Tahakkuk');
  const sahaTahakkukBig = sahaTahakkukGauge ? parseM(sahaTahakkukGauge.big) : 0;
  const toplamHarcamaGauge = d.gauges.find(x => x.label === 'Toplam Harcama');
  const toplamHarcamaBig = toplamHarcamaGauge ? parseM(toplamHarcamaGauge.big) : 0;
  const big = parseM(g.big);

  let value = 0;
  let sub = g.sub;
  let formula = '';

  if (g.label === 'Toplam Tahsilat') {
    value = pctFromRatio(big, sozPotansiyel);
    sub = `Sözleşmeye göre %${pctFromRatio(big, sozGuncel)}`;
    formula = `${t('Toplam Tahsilat')} (${g.big}) / ${t('Toplam Potansiyel Sözleşme Bedeli')} (${d.contractPotential.total}) = %${value}`;
  } else if (g.label === 'Saha Tahakkuk') {
    value = pctFromRatio(big, sozPotansiyel);
    sub = `Sözleşmeye göre %${pctFromRatio(big, sozGuncel)}`;
    formula = `${t('Saha Tahakkuk')} (${g.big}) / ${t('Toplam Potansiyel Sözleşme Bedeli')} (${d.contractPotential.total}) = %${value}`;
  } else if (g.label === 'Toplam Harcama') {
    value = pctFromRatio(big, butceVal);
    formula = `${t('Toplam Harcama')} (${g.big}) / ${t('Bütçe')} (${d.butce}) = %${value}`;
  } else if (g.label === 'Avans Kesintisi') {
    value = pctFromRatio(big, avansTahsilatKdvsiz);
    formula = `${t('Avans Kesintisi')} (${g.big}) / ${t('Toplam Avans Tahsilat')} (${d.avansSummary[0][1]}) = %${value}`;
  } else if (g.label === 'Brüt Hakediş') {
    value = pctFromRatio(big, sozPotansiyel);
    sub = `Sözleşmeye göre %${pctFromRatio(big, sozGuncel)}`;
    formula = `${t('Brüt Hakediş')} (${g.big}) / ${t('Toplam Potansiyel Sözleşme Bedeli')} (${d.contractPotential.total}) = %${value}`;
  } else if (g.label === 'Açık İşler') {
    value = pctFromRatio(big, sahaTahakkukBig);
    formula = `${t('Açık İşler')} (${g.big}) / ${t('Saha Tahakkuk')} (${sahaTahakkukGauge ? sahaTahakkukGauge.big : ''}) = %${value}`;
  } else if (g.label === 'Borç') {
    value = pctFromRatio(big, toplamHarcamaBig);
    sub = `Toplam Harcamaya göre`;
    formula = `${t('Borç')} (${g.big}) / ${t('Toplam Harcama')} (${toplamHarcamaGauge ? toplamHarcamaGauge.big : ''}) = %${value}`;
  } else if (g.label === 'Banka Bakiye') {
    value = pctFromRatio(big, sozPotansiyel);
    formula = `${t('Banka Bakiye')} (${g.big}) / ${t('Toplam Potansiyel Sözleşme Bedeli')} (${d.contractPotential.total}) = %${value}`;
  }

  return { value, sub, formula };
}

function gaugeSVG(value, accent, formula) {
  const size = 84, stroke = 8, r = (size - stroke) / 2, cx = size / 2, cy = size / 2;
  const circumference = 2 * Math.PI * r;
  const clamped = Math.max(0, Math.min(100, value));
  const dashOffset = circumference * (1 - clamped / 100);
  const colors = {
    gold: ['var(--gold)', 'var(--gold-dark)'],
    red: ['var(--red-l)', 'var(--red-d)'],
    green: ['var(--green-l)', 'var(--green-d)'],
    orange: ['var(--orange-l)', 'var(--orange-d)']
  };
  const [c1, c2] = colors[accent] || colors.gold;
  const gid = 'g' + Math.random().toString(36).slice(2, 9);
  const formulaAttr = formula ? ` data-formula="${formula.replace(/"/g, '&quot;')}"` : '';
  return `
    <div class="esta-gauge-ringwrap">
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
        <defs><linearGradient id="${gid}" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="${c1}"/><stop offset="100%" stop-color="${c2}"/>
        </linearGradient></defs>
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${stroke}"/>
        <circle class="esta-gauge-fill" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="url(#${gid})" stroke-width="${stroke}"
          stroke-linecap="round" stroke-dasharray="${circumference}" stroke-dashoffset="${circumference}"
          style="--esta-circ:${circumference}px; --esta-offset:${dashOffset}px;"
          transform="rotate(-90 ${cx} ${cy})"/>
      </svg>
      <div class="esta-gauge-pct esta-gauge-pct-clickable"${formulaAttr}>%${clamped}</div>
    </div>`;
}

function bar1(pct, accent) {
  return `<div class="esta-bar1"><span class="esta-bar1-fill esta-accent-${accent}" style="width:${Math.max(2, pct)}%"></span></div>`;
}

function barChartSVG(items, keys, colors, opts) {
  opts = opts || {};
  const w = Math.max(760, items.length * 40);
  const h = opts.height || 190;
  const padTop = 26, padBottom = 34, padLeft = 4;
  const chartH = h - padTop - padBottom;
  const groupW = (w - padLeft) / items.length;
  const barGap = keys.length > 1 ? 3 : 0;
  const barW = Math.min(22, (groupW - 10) / keys.length - barGap);
  const maxVal = Math.max(...items.flatMap(it => keys.map(k => it[k]))) * 1.08;

  let bars = '';
  let valueLabels = '';
  items.forEach((it, i) => {
    const groupX = padLeft + i * groupW + groupW / 2;
    keys.forEach((k, ki) => {
      const val = it[k];
      const barH = (val / maxVal) * chartH;
      const x = groupX - (barW * keys.length + barGap * (keys.length - 1)) / 2 + ki * (barW + barGap);
      const y = padTop + (chartH - barH);
      bars += `<rect class="esta-bar-grow" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(1,barH).toFixed(1)}" rx="2.5" fill="${colors[ki]}" style="animation-delay:${Math.min(i * 12, 500)}ms"/>`;
      valueLabels += `<text x="${(x + barW / 2).toFixed(1)}" y="${Math.max(10, y - 4).toFixed(1)}" text-anchor="middle" font-size="7.2" font-weight="700" fill="var(--text-secondary)" font-family="Inter">${fmt(val)}</text>`;
    });
    bars += `<text x="${groupX.toFixed(1)}" y="${h - 12}" text-anchor="middle" font-size="9" fill="var(--text-dim)" font-family="Inter" transform="rotate(-55 ${groupX.toFixed(1)} ${h-12})">${trAy(it.m)}</text>`;
  });

  const gridLines = [0,0.25,0.5,0.75,1].map(f => {
    const y = padTop + chartH * f;
    return `<line x1="${padLeft}" y1="${y.toFixed(1)}" x2="${w-4}" y2="${y.toFixed(1)}" stroke="var(--track)" stroke-width="1"/>`;
  }).join('');

  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${gridLines}${bars}${valueLabels}</svg>`;
}

const GRAFIK_COLORS = [
  '#C9A227', '#5EA8A7', '#D97757', '#8B7FD6', '#5DBB63',
  '#4F9DDE', '#D66BA0', '#E0A73E', '#7FBF7F', '#9C7A54',
  '#E06666', '#6699CC'
];

function lineChartSVG(months, series, opts) {
  opts = opts || {};
  const w = Math.max(320, months.length * 55);
  const h = opts.height || 220;
  const padTop = 20, padBottom = 34, padLeft = 36, padRight = 10;
  const chartW = w - padLeft - padRight;
  const chartH = h - padTop - padBottom;
  const stepX = months.length > 1 ? chartW / (months.length - 1) : 0;

  const allVals = series.length ? series.flatMap(s => s.values).filter(v => v !== null && v !== undefined) : [0];
  const maxVal = Math.max(1, ...allVals, 0) * 1.12;

  const gridLines = [0, 0.25, 0.5, 0.75, 1].map(f => {
    const y = padTop + chartH * f;
    const val = Math.round(maxVal * (1 - f));
    return `<line x1="${padLeft}" y1="${y.toFixed(1)}" x2="${w - padRight}" y2="${y.toFixed(1)}" stroke="var(--track)" stroke-width="1"/>
      <text x="${padLeft - 6}" y="${(y + 3).toFixed(1)}" text-anchor="end" font-size="7.5" fill="var(--text-dim)" font-family="Inter">${fmt(val)}</text>`;
  }).join('');

  const monthLabels = months.map((m, i) => {
    const x = padLeft + i * stepX;
    return `<text x="${x.toFixed(1)}" y="${h - 12}" text-anchor="middle" font-size="8" fill="var(--text-dim)" font-family="Inter" transform="rotate(-55 ${x.toFixed(1)} ${h - 12})">${trAy(m)}</text>`;
  }).join('');

  // 1) Her serinin (x,y) piksel konumları — eksik (null) ay varsa o noktada boşluk bırak.
  const seriesPoints = series.map(s => s.values.map((v, i) => {
    if (v === null || v === undefined) return null;
    return { x: padLeft + i * stepX, y: padTop + chartH - (v / maxVal) * chartH, v };
  }));

  // 2) Çizgiler: %50 şeffaf, eksik ayda çizgi kopuyor (0'a inmiyor).
  let paths = '';
  series.forEach((s, si) => {
    let d = '';
    let started = false;
    seriesPoints[si].forEach(p => {
      if (!p) { started = false; return; }
      d += (started ? 'L' : 'M') + p.x.toFixed(1) + ',' + p.y.toFixed(1) + ' ';
      started = true;
    });
    paths += `<path d="${d}" fill="none" stroke="${s.color}" stroke-opacity="0.5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="esta-line-draw" style="animation-delay:${si * 100}ms"/>`;
  });

  // 3) Ayın çakışan (yakın) değerlerini dikeyde birbirinden ayır — sadece
  //    BALONCUĞUN konumu kayar, noktanın kendi gerçek yeri değişmez.
  const cols = months.map(() => []);
  seriesPoints.forEach((pts, si) => {
    pts.forEach((p, i) => { if (p) cols[i].push({ si, x: p.x, trueY: p.y, labelY: p.y, v: p.v }); });
  });
  const MIN_GAP = 19;
  cols.forEach(col => {
    col.sort((a, b) => a.labelY - b.labelY);
    for (let k = 1; k < col.length; k++) {
      if (col[k].labelY - col[k - 1].labelY < MIN_GAP) col[k].labelY = col[k - 1].labelY + MIN_GAP;
    }
  });

  // 4) Noktalar (gerçek konumda) + değer baloncukları (çakışması önlenmiş konumda).
  let dotsAndLabels = '';
  cols.forEach(col => {
    col.forEach(p => {
      const color = series[p.si].color;
      dotsAndLabels += `<circle cx="${p.x.toFixed(1)}" cy="${p.trueY.toFixed(1)}" r="2.6" fill="${color}"/>`;
      const labelText = fmt(p.v);
      const pillW = Math.max(22, labelText.length * 6.3 + 10);
      if (Math.abs(p.labelY - p.trueY) > 3) {
        dotsAndLabels += `<line x1="${p.x.toFixed(1)}" y1="${p.trueY.toFixed(1)}" x2="${p.x.toFixed(1)}" y2="${p.labelY.toFixed(1)}" stroke="${color}" stroke-width="1" stroke-opacity="0.5"/>`;
      }
      dotsAndLabels += `<g>
        <rect x="${(p.x - pillW / 2).toFixed(1)}" y="${(p.labelY - 8.5).toFixed(1)}" width="${pillW.toFixed(1)}" height="17" rx="8.5" fill="${color}"/>
        <text x="${p.x.toFixed(1)}" y="${(p.labelY + 3).toFixed(1)}" text-anchor="middle" font-size="8.5" font-weight="700" fill="#171717" font-family="Inter">${labelText}</text>
      </g>`;
    });
  });

  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${gridLines}${paths}${dotsAndLabels}${monthLabels}</svg>`;
}

function hesaplaKesintiYuzdeleri(d) {
  const avansTahsilat = parseM(d.avansSummary[0][1]);
  const avansKesinti = parseM(d.avansSummary[2][1]);
  const garantiliAlinan = parseM(d.bankaGarantili[0][1]);
  const garantiliKesilen = parseM(d.bankaGarantili[1][1]);
  const garantisizAlinan = parseM(d.bankaGarantisiz[0][1]);
  const garantisizKesilen = parseM(d.bankaGarantisiz[1][1]);
  return {
    avansKesintiPct: pctFromRatio(avansKesinti, avansTahsilat),
    garantiliPct: pctFromRatio(garantiliKesilen, garantiliAlinan),
    garantisizPct: pctFromRatio(garantisizKesilen, garantisizAlinan),
  };
}

function renderAvans(d, vatMode) {
  const isKdvli = vatMode === 'kdvli';
  const pcts = hesaplaKesintiYuzdeleri(d);
  const pctOverrides = {
    avansSummary: { 2: pcts.avansKesintiPct },
    bankaGarantili: { 1: pcts.garantiliPct },
    bankaGarantisiz: { 1: pcts.garantisizPct },
  };
  const rows = (arr, overrides) => arr.map(([l,a,b,p], idx) => {
    const pct = (overrides && overrides[idx] !== undefined) ? overrides[idx] : p;
    return vatRow(t(l), isKdvli ? b : a, pct);
  }).join('');
  const warnVal = isKdvli ? d.potansiyelDusulecek.kdvli : d.potansiyelDusulecek.kdvsiz;

  return `

function buildKalemBazliListe(d) {
  const catMap = {};
  const order = [];
  d.aylikDagilim.forEach(m => {
    m.kalemler.forEach(([name, val]) => {
      if (!catMap[name]) { catMap[name] = { ad: name, toplam: 0, aylik: [] }; order.push(name); }
      catMap[name].toplam += val;
      catMap[name].aylik.push({ ay: m.ay, val });
    });
  });
  return order.map(name => catMap[name]).sort((a, b) => b.toplam - a.toplam);
}

      <button class="esta-saha-head" data-harcama-toggle="${idx}">
        <div class="esta-saha-name">${t(kat.ad)}</div>
        <div class="esta-saha-pct">${fmt(Math.round(total))} M</div>
      </button>
      <div class="esta-saha-detail" id="harcamaDetail${idx}">
        ${monthRows}
        ${altKalemler}
      </div>
      <button class="esta-saha-more" data-harcama-toggle="${idx}">
        <svg id="harcamaChev${idx}" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        <span id="harcamaMoreLabel${idx}">${t('aylık detay')}</span>
      </button>
    </div>`;
}

function renderAndWireHarcamalar() {
  const d = DATA;
  const container = document.getElementById('tab-harcamalar');
  if (!container || !d || !d.harcamalar) return;

  const months = d.harcamalar.aylar;
  if (harcEndIdx === null) harcEndIdx = months.length - 1;

  const startOptions = months.map((m, i) => `<option value="${i}" ${i === harcStartIdx ? 'selected' : ''}>${trAy(m)}</option>`).join('');
  const endOptions = months.map((m, i) => `<option value="${i}" ${i === harcEndIdx ? 'selected' : ''}>${trAy(m)}</option>`).join('');

  const toplamPeriyot = d.harcamalar.toplam.degerler.slice(harcStartIdx, harcEndIdx + 1).reduce((a, b) => a + b, 0);

  const orderedKategoriler = applyStoredOrderToArray(d.harcamalar.kategoriler, 'esta_harcama_order_v1', k => k.ad);
  const kategoriHtml = orderedKategoriler
    .map((k, i) => renderHarcamalarKategori(k, i, months, harcStartIdx, harcEndIdx))
    .join('');

  const presets = [
    { key: 'all', label: t('Başberi') },
    { key: '1', label: t('Son Ay') },
    { key: '3', label: t('Son 3 Ay') },
    { key: '6', label: t('Son 6 Ay') },
    { key: '12', label: t('Son 12 Ay') },
  ];
  const presetsHtml = presets.map(p => {
    let s, e = months.length - 1;
    if (p.key === 'all') s = 0;
    else s = Math.max(0, months.length - Number(p.key));
    const isActive = (harcStartIdx === s && harcEndIdx === e);
    return `<button class="esta-preset-btn ${isActive ? 'active' : ''}" data-preset="${p.key}">${p.label}</button>`;
  }).join('');

  container.innerHTML = `
    <div class="esta-section-title"><span class="esta-section-tick"></span>${t('Dönem Seç')}</div>
    <div class="esta-preset-row">${presetsHtml}</div>
    <div class="esta-card">
      <div style="display:flex; gap:10px; align-items:center;">
        <select id="harcBaslangic" class="esta-select">${startOptions}</select>
        <span style="color:var(--text-muted); font-size:12px; flex-shrink:0;">—</span>
        <select id="harcBitis" class="esta-select">${endOptions}</select>
      </div>
    </div>

    <div class="esta-card esta-card-dark">
      <div class="esta-contract-label">${t('Toplam Harcama (Seçili Dönem)')}</div>
      <div class="esta-contract-total">${fmt(Math.round(toplamPeriyot))} M</div>
    </div>

    <div class="esta-section-title"><span class="esta-section-tick"></span>${t('Harcama Kalemleri')}</div>
    <div id="harcamaKalemList">${kategoriHtml}</div>
  `;

  wireHarcamalar();
}

/* ---------------------------------------------------------------------- */
/* GRAFİKLER — Harcama kalemlerini aylık çizgi grafikte karşılaştırma      */
/* ---------------------------------------------------------------------- */
let grafikSelectedKalemler = null;
let grafikPeriod = 'all'; // 'all' | '3' | '6' | '12'
let grafikGenelSelected = ['harcama', 'tahsilat', 'hakedis'];

const AY_SIRA_TR = { 'Oca':1,'Şub':2,'Mar':3,'Nis':4,'May':5,'Haz':6,'Tem':7,'Ağu':8,'Eyl':9,'Eki':10,'Kas':11,'Ara':12 };
function ayToSortKey(ayStr) {
  const [ay, yil] = ayStr.split('.');
  return Number(yil) * 12 + (AY_SIRA_TR[ay] || 0);
}

function grafikTrim(monthsArr, ...valueArrs) {
  if (grafikPeriod === 'all') return [monthsArr, ...valueArrs];
  const n = Number(grafikPeriod);
  const start = Math.max(0, monthsArr.length - n);
  return [monthsArr.slice(start), ...valueArrs.map(v => v.slice(start))];
}

function buildGenelKarsilastirmaSeries(d) {
  const harcamaSet = new Set(d.harcamalar.aylar);
  const tahsilatSet = new Set(d.monthlyNet.map(r => r.m));
  const hakedisSet = new Set(d.monthlyBrut.map(r => r.m));

  const monthMap = {}; // ay -> { harcama, tahsilat, hakedis }
  d.harcamalar.aylar.forEach((ay, i) => {
    if (!monthMap[ay]) monthMap[ay] = {};
    monthMap[ay].harcama = d.harcamalar.toplam.degerler[i] || 0;
  });
  d.monthlyNet.forEach(row => {
    if (!monthMap[row.m]) monthMap[row.m] = {};
    monthMap[row.m].tahsilat = row.tahsilat || 0;
  });
  d.monthlyBrut.forEach(row => {
    if (!monthMap[row.m]) monthMap[row.m] = {};
    monthMap[row.m].hakedis = row.v || 0;
  });
  const allMonths = Object.keys(monthMap).sort((a, b) => ayToSortKey(a) - ayToSortKey(b));
  // Bir kalemin o ay için hiç verisi yoksa (0 değil, hiç girilmemişse) null
  // döndürüyoruz — çizgi o noktada 0'a inmek yerine kopuyor/kırpılıyor.
  return {
    months: allMonths,
    harcama: allMonths.map(ay => harcamaSet.has(ay) ? (monthMap[ay].harcama || 0) : null),
    tahsilat: allMonths.map(ay => tahsilatSet.has(ay) ? (monthMap[ay].tahsilat || 0) : null),
    hakedis: allMonths.map(ay => hakedisSet.has(ay) ? (monthMap[ay].hakedis || 0) : null)
  };
}

function renderAndWireGrafikler() {
  const d = DATA;
  const container = document.getElementById('tab-grafikler');
  if (!container || !d || !d.harcamalar) return;

  const kategoriler = d.harcamalar.kategoriler;

  if (!grafikSelectedKalemler) {
    const sorted = [...kategoriler].sort((a, b) => b.odenen - a.odenen);
    grafikSelectedKalemler = sorted.slice(0, 4).map(k => k.ad);
  }

  const presets = [
    { key: 'all', label: t('Başberi') },
    { key: '3', label: t('Son 3 Ay') },
    { key: '6', label: t('Son 6 Ay') },
    { key: '12', label: t('Son 12 Ay') },
  ];
  const presetsHtml = presets.map(p => `
    <button class="esta-preset-btn ${grafikPeriod === p.key ? 'active' : ''}" data-grafik-period="${p.key}">${p.label}</button>
  `).join('');

  const expandIcon = '';

  // --- Kalem karşılaştırma grafiği ---
  const chipsHtml = kategoriler.map((k, i) => {
    const active = grafikSelectedKalemler.includes(k.ad);
    const color = GRAFIK_COLORS[i % GRAFIK_COLORS.length];
    return `<button class="esta-chip ${active ? 'active' : ''}" data-grafik-kalem="${k.ad}"><span class="esta-chip-swatch" style="background:${color}"></span>${t(k.ad)}</button>`;
  }).join('');

  const rawSeries = kategoriler
    .map((k, i) => ({ ad: k.ad, color: GRAFIK_COLORS[i % GRAFIK_COLORS.length], values: k.aylik }))
    .filter(s => grafikSelectedKalemler.includes(s.ad));

  const [kalemMonths, ...kalemValueArrs] = grafikTrim(d.harcamalar.aylar, ...rawSeries.map(s => s.values));
  const activeSeries = rawSeries.map((s, i) => ({ ad: s.ad, color: s.color, values: kalemValueArrs[i] }));

  const chartHtml = activeSeries.length
    ? lineChartSVG(kalemMonths, activeSeries)
    : `<div class="esta-tiny-note" style="padding:40px 0; text-align:center;">${t('Karşılaştırmak için en az bir kalem seç')}</div>`;

  const legendHtml = activeSeries.map(s => `
    <span class="esta-line-legend-item"><i style="background:${s.color}"></i>${t(s.ad)}</span>
  `).join('');

  // --- Genel karşılaştırma grafiği (Harcama / Tahsilat / Hakediş) ---
  const gv = buildGenelKarsilastirmaSeries(d);
  const genelDefs = [
    { key: 'harcama', label: t('Toplam Harcama'), color: 'var(--red-l)', values: gv.harcama },
    { key: 'tahsilat', label: t('Tahsilat'), color: 'var(--tahsilat-green)', values: gv.tahsilat },
    { key: 'hakedis', label: t('Toplam Hakediş'), color: 'var(--gold)', values: gv.hakedis },
  ];
  const genelChipsHtml = genelDefs.map(g => `
    <button class="esta-chip ${grafikGenelSelected.includes(g.key) ? 'active' : ''}" data-grafik-genel="${g.key}"><span class="esta-chip-swatch" style="background:${g.color}"></span>${g.label}</button>`).join('');

  const genelActive = genelDefs.filter(g => grafikGenelSelected.includes(g.key));
  const [genelMonths, ...genelValueArrs] = grafikTrim(gv.months, ...genelActive.map(g => g.values));
  const genelSeries = genelActive.map((g, i) => ({ ad: g.label, color: g.color, values: genelValueArrs[i] }));

  const genelChartHtml = genelSeries.length
    ? lineChartSVG(genelMonths, genelSeries)
    : `<div class="esta-tiny-note" style="padding:40px 0; text-align:center;">${t('Karşılaştırmak için en az bir seçenek seç')}</div>`;
  const genelLegendHtml = genelSeries.map(s => `
    <span class="esta-line-legend-item"><i style="background:${s.color}"></i>${s.ad}</span>
  `).join('');

  container.innerHTML = `
    <div class="esta-section-title"><span class="esta-section-tick"></span>${t('Dönem Seç')}</div>
    <div class="esta-preset-row">${presetsHtml}</div>

    <div class="esta-section-title"><span class="esta-section-tick"></span>${t('Genel Karşılaştırma')}</div>
    <div class="esta-card esta-chart-wrap">
      <div class="esta-chart-scroll">${genelChartHtml}</div>
      ${genelSeries.length ? `<div class="esta-chart-legend" style="flex-wrap:wrap; row-gap:6px;">${genelLegendHtml}</div>` : ''}
      ${genelSeries.length ? `<div class="esta-tiny-note">← ${t('kaydırarak tüm ayları gör')} →</div>` : ''}
    </div>
    <div class="esta-card"><div class="esta-chip-row">${genelChipsHtml}</div></div>

    <div class="esta-section-title"><span class="esta-section-tick"></span>${t('Harcama Kalemleri Karşılaştırma')}</div>
    <div class="esta-card esta-chart-wrap">
      <div class="esta-chart-scroll">${chartHtml}</div>
      ${activeSeries.length ? `<div class="esta-chart-legend" style="flex-wrap:wrap; row-gap:6px;">${legendHtml}</div>` : ''}
      ${activeSeries.length ? `<div class="esta-tiny-note">← ${t('kaydırarak tüm ayları gör')} →</div>` : ''}
    </div>

    <div class="esta-section-title"><span class="esta-section-tick"></span>${t('Kalem Seç')}</div>
    <div class="esta-card"><div class="esta-chip-row">${chipsHtml}</div></div>
  `;

  wireGrafikler();
}

function wireGrafikler() {
  document.querySelectorAll('[data-grafik-kalem]').forEach(chip => {
    chip.addEventListener('click', () => {
      const ad = chip.getAttribute('data-grafik-kalem');
      if (grafikSelectedKalemler.includes(ad)) {
        grafikSelectedKalemler = grafikSelectedKalemler.filter(x => x !== ad);
      } else {
        grafikSelectedKalemler.push(ad);
      }
      renderAndWireGrafikler();
    });
  });
  document.querySelectorAll('[data-grafik-genel]').forEach(chip => {
    chip.addEventListener('click', () => {
      const key = chip.getAttribute('data-grafik-genel');
      if (grafikGenelSelected.includes(key)) {
        grafikGenelSelected = grafikGenelSelected.filter(x => x !== key);
      } else {
        grafikGenelSelected.push(key);
      }
      renderAndWireGrafikler();
    });
  });
  document.querySelectorAll('[data-grafik-period]').forEach(btn => {
    btn.addEventListener('click', () => {
      grafikPeriod = btn.getAttribute('data-grafik-period');
      renderAndWireGrafikler();
    });
  });
}

function wireHarcamalar() {
  const harcamaList = document.getElementById('harcamaKalemList');
  if (harcamaList) {
    harcamaList.dataset.reorderWired = '';
    enableLongPressReorder(harcamaList, '.esta-saha-card', 'data-reorder-id', 'esta_harcama_order_v1');
  }

  const months = DATA.harcamalar.aylar;
  document.querySelectorAll('[data-preset]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.getAttribute('data-preset');
      let s, e = months.length - 1;
      if (key === 'all') s = 0;
      else s = Math.max(0, months.length - Number(key));
      harcStartIdx = s; harcEndIdx = e;
      renderAndWireHarcamalar();
    });
  });

  const bas = document.getElementById('harcBaslangic');
  const bit = document.getElementById('harcBitis');
  if (bas && bit) {
    bas.addEventListener('change', () => {
      let s = Number(bas.value), e = Number(bit.value);
      if (s > e) e = s;
      harcStartIdx = s; harcEndIdx = e;
      renderAndWireHarcamalar();
    });
    bit.addEventListener('change', () => {
      let s = Number(bas.value), e = Number(bit.value);
      if (e < s) s = e;
      harcStartIdx = s; harcEndIdx = e;
      renderAndWireHarcamalar();
    });
  }

  document.querySelectorAll('[data-harcama-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = btn.getAttribute('data-harcama-toggle');
      const detail = document.getElementById('harcamaDetail' + idx);
      const chev = document.getElementById('harcamaChev' + idx);
      const label = document.getElementById('harcamaMoreLabel' + idx);
      const isOpen = detail.classList.toggle('open');
      chev.style.transform = isOpen ? 'rotate(180deg)' : 'rotate(0deg)';
      label.textContent = isOpen ? 'gizle' : 'aylık detay';
    });
  });
}

function downloadPDF() {
  if (!DATA || !window.jspdf) return;
  const d = DATA;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  let y = 90;
  const LOGO_W = 26, LOGO_H = 30.8;

  // jsPDF'in standart (helvetica) fontu Türkçe'ye özgü ş/ğ/ı/İ harflerini
  // içermiyor (WinAnsi kodlaması) — PDF'te bozuk çıkmasın diye ASCII'ye çeviriyoruz.
  // ö/ü/ç/Ö/Ü/Ç zaten WinAnsi'de var, onlara dokunmuyoruz.
  function pdfSafe(s) {
    return String(s)
      .replace(/ş/g, 's').replace(/Ş/g, 'S')
      .replace(/ğ/g, 'g').replace(/Ğ/g, 'G')
      .replace(/ı/g, 'i').replace(/İ/g, 'I')
      .replace(/→/g, '->')
      .replace(/№/g, 'No')
      .replace(/Доп\./g, 'Dop.')
      .replace(/[\u0400-\u04FF]/g, '');
  }

  function pageHeader(title) {
    doc.setFillColor(20, 20, 20);
    doc.rect(0, 0, pageW, 60, 'F');
    try { doc.addImage(PDF_LOGO, 'PNG', 40, 14, LOGO_W, LOGO_H); } catch (e) {}
    const textX = 40 + LOGO_W + 10;
    doc.setTextColor(196, 168, 118);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(16);
    doc.text('ESTA CONSTRUCTION', textX, 28);
    doc.setTextColor(245, 245, 245);
    doc.setFontSize(11);
    doc.setFont('helvetica', 'normal');
    doc.text(pdfSafe(title), textX, 46);
    doc.setTextColor(170, 165, 150);
    doc.setFontSize(9);
    doc.text(pdfSafe(d.meta.project + ' · ' + d.meta.date), pageW - 40, 46, { align: 'right' });
    y = 90;
  }

  function sectionTitle(t) {
    if (y > pageH - 60) { doc.addPage(); pageHeader(t); }
    doc.setTextColor(30, 28, 24);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11);
    doc.text(pdfSafe(t).toUpperCase(), 40, y);
    y += 6;
    doc.setDrawColor(196, 168, 118);
    doc.setLineWidth(1);
    doc.line(40, y, pageW - 40, y);
    y += 16;
  }

  function row(label, value) {
    if (y > pageH - 40) { doc.addPage(); y = 60; }
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10);
    doc.setTextColor(90, 86, 78);
    doc.text(pdfSafe(label), 40, y);
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(20, 20, 20);
    doc.text(pdfSafe(value), pageW - 40, y, { align: 'right' });
    y += 16;
  }

  function colHeader(left, right) {
    if (y > pageH - 40) { doc.addPage(); y = 60; }
    doc.setFont('helvetica', 'italic');
    doc.setFontSize(8.5);
    doc.setTextColor(150, 145, 130);
    doc.text(pdfSafe(left), 40, y);
    doc.text(pdfSafe(right), pageW - 40, y, { align: 'right' });
    y += 4;
    doc.setDrawColor(225, 220, 205);
    doc.setLineWidth(0.5);
    doc.line(40, y, pageW - 40, y);
    y += 12;
  }

  // SAYFA 1 — ÖZET
  pageHeader('Finansal Özet');
  sectionTitle(d.contractCurrent.label);
  row('Toplam', d.contractCurrent.total);
  d.contractCurrent.items.forEach(([k, v]) => row(k, v));
  y += 6;
  sectionTitle(d.contractPotential.label);
  row('Toplam', d.contractPotential.total);
  d.contractPotential.items.forEach(([k, v]) => row(k, v));
  y += 6;
  sectionTitle('Finansal Göstergeler');
  d.gauges.forEach(g => row(g.label, g.big + '  (%' + computeGaugeStats(g, d).value + ')'));
  y += 6;
  sectionTitle('Süreç Takvimi');
  row('CMP', d.kalanGun.cmpGun + ' gün kaldı · ' + d.kalanGun.cmpTarih);
  row('PNR', d.kalanGun.pnrGun + ' gün kaldı · ' + d.kalanGun.pnrTarih);
  row('Gecen gun orani (PNR)', '%' + d.kalanGun.gecenPnr);
  y += 6;
  sectionTitle('Banka Bakiye ve Açık İşler');
  row('Banka Bakiye (Borç Hariç)', d.bankaBakiye.bakiye);
  row('Harcama', d.bankaBakiye.harcama);
  row('Açık İşler', d.bankaBakiye.acikIsler + '  (%' + d.bankaBakiye.pct + ')');

  // SAYFA 2 — AVANS + HAKEDİŞ
  doc.addPage();
  pageHeader('Avans ve Hakediş');
  sectionTitle("Severstal Avans Tablosu (KDV'siz)");
  d.avansSummary.forEach(([l, a, , p]) => row(l, a + (p != null ? '  (%' + p + ')' : '')));
  y += 6;

  // SAYFA 3 — SAHA
  doc.addPage();
  pageHeader('Personel ve Saha İlerleme');
  sectionTitle('Personel Durumu');
  row('Toplam Personel', fmt(d.personel.toplam));
  row('ESTA Direkt', fmt(d.personel.estaDirekt));
  row('ESTA Endirekt', fmt(d.personel.estaEndirekt));
  row('Taşeron Direkt', fmt(d.personel.taseronDirekt));

    row(it.name, fmt(it.gerc) + ' / ' + fmt(it.proje) + ' ' + it.unit + '  (%' + pctFromRatio(it.gerc, it.proje) + ')');
  });

  doc.save('ESTA-110SPPC-Rapor.pdf');
}

function wireCollapse(headId, bodyId, chevId) {
  const head = document.getElementById(headId);
  const body = document.getElementById(bodyId);
  const chev = document.getElementById(chevId);
  if (head) {
    head.addEventListener('click', () => {
      body.classList.toggle('open');
      chev.classList.toggle('open');
    });
  }
}

function wireRippleEffect() {
  const RIPPLE_SELECTOR = '.esta-navbtn, .esta-collapse-head, .esta-saha-head, .esta-saha-more, ' +
    '.esta-preset-btn, .esta-vat-btn, .esta-pdf-btn, .esta-theme-toggle, .esta-subnav-btn';
  document.addEventListener('pointerdown', (e) => {
    const host = e.target.closest(RIPPLE_SELECTOR);
    if (!host) return;
    const cs = getComputedStyle(host);
    if (cs.position === 'static') host.style.position = 'relative';
    if (cs.overflow !== 'hidden') host.style.overflow = 'hidden';

    const rect = host.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height) * 1.6;
    const ripple = document.createElement('span');
    ripple.className = 'esta-ripple';
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
    host.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
  });
}

function wireGaugeFormula() {
  let toastEl = document.getElementById('formulaToast');
  if (!toastEl) {
    toastEl = document.createElement('div');
    toastEl.id = 'formulaToast';
    toastEl.className = 'esta-formula-toast';
    document.body.appendChild(toastEl);
  }
  let hideTimer = null;
  document.addEventListener('click', (e) => {
    const target = e.target.closest('.esta-gauge-pct-clickable');
    if (!target) {
      toastEl.classList.remove('show');
      return;
    }
    const formula = target.getAttribute('data-formula');
    if (!formula) return;
    toastEl.textContent = formula;
    toastEl.classList.add('show');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => toastEl.classList.remove('show'), 4000);
  });
}

function wireInteractions() {
  wireCollapse('currentToggle', 'currentBody', 'currentChev');
  wireCollapse('potentialToggle', 'potentialBody', 'potentialChev');

  const pdfBtn = document.getElementById('pdfBtn');
  if (pdfBtn) pdfBtn.addEventListener('click', downloadPDF);

  document.querySelectorAll('[data-saha-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = btn.getAttribute('data-saha-toggle');
      const detail = document.getElementById('sahaDetail' + idx);
      const chev = document.getElementById('sahaChev' + idx);
      const label = document.getElementById('sahaMoreLabel' + idx);
      const isOpen = detail.classList.toggle('open');
      if (chev) chev.style.transform = isOpen ? 'rotate(180deg)' : 'rotate(0deg)';
      if (label) label.textContent = isOpen ? 'daha az' : 'detay';
    });
  });
}

/* ---------------------------------------------------------------------- */
/* SÜRÜKLE-BIRAK SIRALAMA — herhangi bir öğeye basılı tutunca sıralama    */
/* moduna girer, sürükleyip bırakınca yeni sıra o cihaza kaydedilir.      */
/* ---------------------------------------------------------------------- */
function getStoredOrder(storageKey) {
  try {
    const raw = localStorage.getItem(storageKey);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function applyStoredOrderToArray(arr, storageKey, idFn) {
  const order = getStoredOrder(storageKey);
  if (!order || !order.length) return arr;
  const map = {};
  arr.forEach(item => { map[idFn(item)] = item; });
  const ordered = order.filter(id => map[id]).map(id => map[id]);
  arr.forEach(item => { if (!order.includes(idFn(item))) ordered.push(item); });
  return ordered.length === arr.length ? ordered : arr;
}

function enableLongPressReorder(containerEl, itemSelector, idAttr, storageKey) {
  if (!containerEl || containerEl.dataset.reorderWired) return;
  containerEl.dataset.reorderWired = '1';

  let longPressTimer = null;
  let reorderModeActive = false;
  let dragging = null;
  let startX = 0, startY = 0;

  function getItems() { return Array.from(containerEl.querySelectorAll(itemSelector)); }

  function enterReorderMode() {
    reorderModeActive = true;
    containerEl.classList.add('esta-reorder-mode');
    if (navigator.vibrate) { try { navigator.vibrate(30); } catch (e) {} }
  }

  function exitReorderMode() {
    reorderModeActive = false;
    containerEl.classList.remove('esta-reorder-mode');
  }

  function saveOrder() {
    const order = getItems().map(el => el.getAttribute(idAttr));
    try { localStorage.setItem(storageKey, JSON.stringify(order)); } catch (e) {}
  }

  function startDrag(item, pointerId, startEvt) {
    dragging = item;
    try { item.setPointerCapture(pointerId); } catch (e) {}
    item.classList.add('esta-dragging');

    const onMove = (ev) => {
      ev.preventDefault();
      const target = document.elementFromPoint(ev.clientX, ev.clientY);
      const targetItem = target && target.closest(itemSelector);
      if (targetItem && targetItem !== dragging && containerEl.contains(targetItem)) {
        const items = getItems();
        const draggingIdx = items.indexOf(dragging);
        const targetIdx = items.indexOf(targetItem);
        if (draggingIdx < targetIdx) targetItem.after(dragging);
        else targetItem.before(dragging);
      }
    };
    const onUp = (ev) => {
      try { item.releasePointerCapture(ev.pointerId); } catch (e) {}
      item.classList.remove('esta-dragging');
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      exitReorderMode();
      saveOrder();
      if (containerEl.id === 'bottomnav' && typeof updateNavSlider === 'function') updateNavSlider();
      dragging = null;
    };
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  }

  getItems().forEach(item => {
    item.addEventListener('contextmenu', (e) => e.preventDefault());
    item.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      startX = e.clientX; startY = e.clientY;
      const pointerId = e.pointerId;
      longPressTimer = setTimeout(() => {
        enterReorderMode();
        startDrag(item, pointerId, e);
      }, 480);
    });
    const cancelIfMoved = (e) => {
      if (!reorderModeActive && longPressTimer) {
        if (Math.abs(e.clientX - startX) > 8 || Math.abs(e.clientY - startY) > 8) {
          clearTimeout(longPressTimer);
        }
      }
    };
    item.addEventListener('pointermove', cancelIfMoved);
    item.addEventListener('pointerup', () => clearTimeout(longPressTimer));
    item.addEventListener('pointercancel', () => clearTimeout(longPressTimer));
  });
}

function wireReorderables() {
  enableLongPressReorder(document.getElementById('bottomnav'), '.esta-navbtn', 'data-tab', 'esta_nav_order_v1');
  const gaugeGrid = document.querySelector('.esta-gauge-grid');
  if (gaugeGrid) {
    gaugeGrid.dataset.reorderWired = '';
    enableLongPressReorder(gaugeGrid, '.esta-gauge-card', 'data-reorder-id', 'esta_gauge_order_v1');
  }
  const sahaGrid = document.getElementById('sahaIlerlemeGrid');
  if (sahaGrid) {
    sahaGrid.dataset.reorderWired = '';
    enableLongPressReorder(sahaGrid, '.esta-saha-compact', 'data-reorder-id', 'esta_saha_order_v1');
  }
  const acikGrid = document.querySelector('.esta-acik-grid');
  if (acikGrid) {
    acikGrid.dataset.reorderWired = '';
    enableLongPressReorder(acikGrid, '.esta-acik-compact', 'data-reorder-id', 'esta_acikisler_order_v1');
  }
}

function applyStoredNavOrder() {
  const nav = document.getElementById('bottomnav');
  if (!nav) return;
  const order = getStoredOrder('esta_nav_order_v1');
  if (!order || !order.length) return;
  const items = Array.from(nav.querySelectorAll('.esta-navbtn'));
  const map = {};
  items.forEach(el => { map[el.getAttribute('data-tab')] = el; });
  order.forEach(id => { if (map[id]) nav.appendChild(map[id]); });
  items.forEach(el => { if (!order.includes(el.getAttribute('data-tab'))) nav.appendChild(el); });
}

function updateNavSlider() {
  const nav = document.getElementById('bottomnav');
  const slider = document.getElementById('navSlider');
  if (!nav || !slider) return;
  const active = nav.querySelector('.esta-navbtn.active');
  if (!active) return;

  const isDesktop = window.matchMedia('(min-width: 900px)').matches;
  if (isDesktop) {
    const w = 3;
    slider.style.width = w + 'px';
    slider.style.height = active.offsetHeight + 'px';
    slider.style.left = '0px';
    slider.style.bottom = 'auto';
    slider.style.top = '0px';
    slider.style.transform = `translateY(${active.offsetTop}px)`;
  } else {
    const w = Math.round(active.offsetWidth * 0.5);
    slider.style.width = w + 'px';
    slider.style.height = '3px';
    slider.style.bottom = '0px';
    slider.style.top = 'auto';
    const centerOffset = active.offsetLeft + (active.offsetWidth - w) / 2;
    slider.style.transform = `translateX(${centerOffset}px)`;
  }
}

function wireNav() {
  document.querySelectorAll('.esta-navbtn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.esta-navbtn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.esta-tab-body').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      const target = document.getElementById('tab-' + btn.getAttribute('data-tab'));
      target.classList.add('active');
      updateNavSlider();

      if (window.matchMedia('(min-width: 900px)').matches) {
        // Geniş ekranda tüm bölümler zaten görünür — tıklanan bölüme kaydır.
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } else {
        document.querySelector('.esta-content').scrollTop = 0;
      }
    });
  });
  updateNavSlider();
  window.addEventListener('resize', updateNavSlider);
}

function setupScrollSpy() {
  // Sadece geniş ekran dashboard görünümünde: kaydırırken hangi bölüm
  // ekrandaysa kenar menüdeki ilgili buton otomatik aktif olsun.
  if (!window.matchMedia('(min-width: 900px)').matches) return;
  const content = document.querySelector('.esta-content');
  const sections = document.querySelectorAll('.esta-tab-body');
  const navButtons = document.querySelectorAll('.esta-navbtn');
  if (!content || !sections.length) return;

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const tabId = entry.target.id.replace('tab-', '');
        navButtons.forEach(b => b.classList.toggle('active', b.getAttribute('data-tab') === tabId));
        updateNavSlider();
      }
    });
  }, { root: content, rootMargin: '-10% 0px -70% 0px', threshold: 0 });

  sections.forEach(s => observer.observe(s));
}
