let SEARCH_INDEX = [];

function buildSearchIndex(d) {
  SEARCH_INDEX = [
    { label: t('Özet'), tab: 'ozet', tag: t('Sekme') },
    { label: t('Avans'), tab: 'avans', tag: t('Sekme') },
    { label: t('Hakediş'), tab: 'hakedis', tag: t('Sekme') },
    { label: t('Açık İşler'), tab: 'acikisler', tag: t('Sekme') },
    { label: t('Saha'), tab: 'saha', tag: t('Sekme') },
    { label: t('Personel'), tab: 'saha', tag: t('Sekme') },
    { label: t('Harcamalar'), tab: 'harcamalar', tag: t('Sekme') },
    { label: t('Grafikler'), tab: 'grafikler', tag: t('Sekme') },
  ];
  d.gauges.forEach((g, i) => SEARCH_INDEX.push({ label: t(g.label), tab: 'ozet', tag: t('Gösterge'), elId: 'item-gauge-' + i }));
  d.hakedisTipleri.forEach((h, i) => SEARCH_INDEX.push({ label: t(h[0]), tab: 'acikisler', tag: t('Açık İşler'), elId: 'item-acik-' + i }));
  d.kesintiler.forEach((k) => SEARCH_INDEX.push({ label: t(k[0]), tab: 'hakedis', tag: t('Kesinti') }));
  d.avansSummary.forEach((a) => SEARCH_INDEX.push({ label: t(a[0]), tab: 'avans', tag: t('Avans') }));
  d.sahaItems.forEach((s, i) => SEARCH_INDEX.push({ label: t(s.name), tab: 'saha', tag: t('Saha'), elId: 'item-saha-' + i }));
  d.aylikDagilim.forEach((m, i) => SEARCH_INDEX.push({ label: trAy(m.ay), tab: 'hakedis', tag: t('Ay'), elId: 'item-aylik-' + i }));
  if (d.harcamalar) {
    d.harcamalar.kategoriler.forEach((k, i) => SEARCH_INDEX.push({ label: t(k.ad), tab: 'harcamalar', tag: t('Harcama'), elId: 'item-harcama-' + i }));
  }
}

function runSearch(query) {
  const resultsEl = document.getElementById('searchResults');
  const q = query.trim().toLocaleLowerCase('tr');
  if (!q) { resultsEl.classList.remove('open'); resultsEl.innerHTML = ''; return; }

  const matches = SEARCH_INDEX.filter(it => it.label.toLocaleLowerCase('tr').includes(q)).slice(0, 8);
  if (!matches.length) {
    resultsEl.innerHTML = '<div class="esta-search-result-item">Sonuç bulunamadı</div>';
    resultsEl.classList.add('open');
    return;
  }

  resultsEl.innerHTML = matches.map((m, i) => `
    <div class="esta-search-result-item" data-search-idx="${i}">
      <span>${m.label}</span><span class="esta-search-result-tag">${m.tag}</span>
    </div>`).join('');
  resultsEl.classList.add('open');

  resultsEl.querySelectorAll('[data-search-idx]').forEach(row => {
    row.addEventListener('click', () => {
      const idx = Number(row.getAttribute('data-search-idx'));
      goToSearchResult(matches[idx]);
    });
  });
}

function goToSearchResult(item) {
  const navBtn = document.querySelector('.esta-navbtn[data-tab="' + item.tab + '"]');
  if (navBtn) navBtn.click();
  document.getElementById('searchInput').value = '';
  document.getElementById('searchResults').classList.remove('open');

  setTimeout(() => {
    if (item.elId) {
      const el = document.getElementById(item.elId);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.classList.add('esta-search-highlight');
        setTimeout(() => el.classList.remove('esta-search-highlight'), 1500);
      }
    }
  }, 260);
}

function wireSearch() {
  const input = document.getElementById('searchInput');
  if (!input) return;
  input.addEventListener('input', (e) => runSearch(e.target.value));
  input.addEventListener('focus', (e) => { if (e.target.value) runSearch(e.target.value); });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.esta-search-wrap')) {
      document.getElementById('searchResults').classList.remove('open');
    }
  });
}

function initApp() {
  fetch('data.json', { cache: 'no-store' })
    .then(res => res.json())
    .then(d => {
      DATA = d;
      document.getElementById('hdrProject').textContent = d.meta.project;
      document.getElementById('hdrDate').textContent = d.meta.date;

      document.getElementById('tab-ozet').innerHTML = renderOzet(d);
      renderAndWireAvans();
      document.getElementById('tab-hakedis').innerHTML = renderHakedis(d);
      document.getElementById('tab-acikisler').innerHTML = renderAcikIsler(d);
      document.getElementById('tab-saha').innerHTML = renderSaha(d);
      renderAndWireHarcamalar();
      renderAndWireGrafikler();
      renderAndWireAylik();

      applyStoredNavOrder();
      wireInteractions();
      wireNav();
      wireReorderables();
      wireRippleEffect();
      wireGaugeFormula();
      setupScrollSpy();
      buildSearchIndex(d);
      wireSearch();

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }
    })
    .catch(err => {
      document.getElementById('tab-ozet').innerHTML = '<div class="esta-loading">Veri yüklenemedi: data.json dosyasının index.html ile aynı klasörde olduğundan emin olun.</div>';
      console.error(err);
    });
}
